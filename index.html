<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="screen" data-screen="start">
        <div class="overlay-box">
          <p class="screen-title">TETRIS</p>
          <button id="start-btn">Jugar</button>

          <div class="records-section">
            <p class="records-title">RECORDS</p>
            <ol id="start-records-list" class="records-list"></ol>
            <p id="start-records-best" class="records-best"></p>
            <button id="reset-records-btn" class="link-btn">Borrar records</button>
          </div>
        </div>
      </div>

      <div class="screen" data-screen="message" hidden>
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>

          <div id="records-entry" class="records-entry" hidden>
            <label for="records-name-input">¡Nuevo record! Tu nombre:</label>
            <div class="records-entry-row">
              <input id="records-name-input" type="text" maxlength="12" placeholder="Jugador" />
              <button id="records-save-btn">Guardar</button>
            </div>
          </div>

          <div id="message-records-section" class="records-section">
            <p class="records-title">RECORDS</p>
            <ol id="message-records-list" class="records-list"></ol>
            <p id="message-records-best" class="records-best"></p>
          </div>

          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
